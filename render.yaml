# Blueprint do Render: cria a API (NestJS) a partir do Dockerfile do backend.
# O banco fica no Neon; o frontend fica na Vercel. Veja docs/04-deploy.md.
services:
  - type: web
    name: finora-api
    runtime: docker
    plan: free
    region: virginia            # perto do Neon em us-east-1; pode trocar no painel
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: checksPass   # só publica se o CI do GitHub passar
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false             # você cola a connection string do Neon no painel
      - key: JWT_ACCESS_SECRET
        generateValue: true     # o Render gera um segredo forte
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: APP_TIMEZONE
        value: America/Manaus
